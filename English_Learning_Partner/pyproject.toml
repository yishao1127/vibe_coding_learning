[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-learning-partner"
version = "0.1.0"
description = "A personal Windows desktop English learning partner powered by a local OpenAI Responses API-compatible model service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "pyinstaller>=6.0,<7",
    "Pillow>=10,<13",
]

[project.scripts]
english-learning-partner = "english_learning_partner.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
