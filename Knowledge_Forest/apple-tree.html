<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>苹果树</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8f7; }
  canvas { display: block; }
  #tip { position: fixed; top: 10px; left: 10px; color: #333; font-family: sans-serif; font-size: 13px; background: rgba(255,255,255,0.65); padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="tip">鼠标拖动旋转视角，滚轮缩放</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f7, 60, 160);
scene.background = new THREE.Color(0xcfe8f7);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 22, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 13, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 15;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

// ---------- 光照 ----------
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3a5a2e, 0.7));
const sun = new THREE.DirectionalLight(0xfff3d6, 1.4);
sun.position.set(30, 45, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0015;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.3);
fill.position.set(-25, 20, -20);
scene.add(fill);

// ---------- 地面 ----------
const groundGeo = new THREE.CircleGeometry(70, 96);
groundGeo.rotateX(-Math.PI / 2);
const groundPos = groundGeo.attributes.position;
for (let i = 0; i < groundPos.count; i++) {
  const x = groundPos.getX(i), z = groundPos.getZ(i);
  const d = Math.sqrt(x*x + z*z);
  const bump = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 0.6 + Math.sin(d * 0.3) * 0.3;
  groundPos.setY(i, bump * Math.max(0, 1 - d / 70));
}
groundGeo.computeVertexNormals();
const groundMat = new THREE.MeshStandardMaterial({ color: 0x6fa84f, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);

const grassMat = new THREE.MeshStandardMaterial({ color: 0x5c9a44, roughness: 1 });
for (let i = 0; i < 140; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 6 + Math.random() * 55;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const h = 0.6 + Math.random() * 1.2;
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.25 + Math.random()*0.15, h, 5), grassMat);
  tuft.position.set(x, h/2, z);
  tuft.rotation.y = Math.random() * Math.PI;
  tuft.castShadow = true;
  scene.add(tuft);
}

// 掉落在地上的苹果
const droppedApples = [];

// ---------- 材质 ----------
const barkTexCanvas = document.createElement('canvas');
barkTexCanvas.width = 128; barkTexCanvas.height = 128;
{
  const ctx = barkTexCanvas.getContext('2d');
  ctx.fillStyle = '#5b3a24';
  ctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 400; i++) {
    ctx.strokeStyle = `rgba(0,0,0,${0.05 + Math.random()*0.15})`;
    ctx.lineWidth = 1 + Math.random();
    ctx.beginPath();
    const x = Math.random() * 128;
    ctx.moveTo(x, 0);
    ctx.lineTo(x + (Math.random()-0.5)*10, 128);
    ctx.stroke();
  }
}
const barkTex = new THREE.CanvasTexture(barkTexCanvas);
barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping;
barkTex.repeat.set(2, 1);

const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, color: 0x9c7a5c, roughness: 0.95, metalness: 0.02 });

const leafColors = [0x2e6b2e, 0x3f8f3f, 0x4fa84a, 0x357a35, 0x5cb85c];
const leafMats = leafColors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, flatShading: true }));

const appleMat = new THREE.MeshStandardMaterial({ color: 0xc21f26, roughness: 0.45, metalness: 0.05 });
const appleHighlightMat = new THREE.MeshStandardMaterial({ color: 0xe0432f, roughness: 0.4, metalness: 0.05 });
const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a2f18, roughness: 0.9 });
const appleGeo = new THREE.SphereGeometry(0.55, 10, 8);
const stemGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.25, 5);

function addApple(pos) {
  const apple = new THREE.Mesh(appleGeo, Math.random() < 0.5 ? appleMat : appleHighlightMat);
  apple.position.copy(pos);
  apple.scale.set(0.8 + Math.random()*0.5, 0.8 + Math.random()*0.5, 0.8 + Math.random()*0.5);
  apple.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  apple.castShadow = true;
  apple.receiveShadow = true;
  scene.add(apple);

  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.copy(pos).add(new THREE.Vector3(0, 0.35, 0));
  stem.castShadow = true;
  scene.add(stem);
}

// ---------- 递归生成树 ----------
const branchMeshes = [];
const leafPositions = [];

function addBranch(origin, dir, length, radius, depth, maxDepth) {
  const end = origin.clone().add(dir.clone().multiplyScalar(length));
  const segs = 8;
  const geo = new THREE.CylinderGeometry(Math.max(radius * 0.62, 0.03), radius, length, segs, 1, true);
  const mesh = new THREE.Mesh(geo, barkMat);
  mesh.position.copy(origin.clone().add(end).multiplyScalar(0.5));
  const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.quaternion.copy(quat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  branchMeshes.push(mesh);

  if (depth <= 0 || radius < 0.06) {
    leafPositions.push({ pos: end.clone(), scale: 1.1 + Math.random() * 0.6 });
    return;
  }

  const branches = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < branches; i++) {
    const angle = 0.45 + Math.random() * 0.35;
    const axis = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.3, Math.random() - 0.5).normalize();
    const rot = new THREE.Quaternion().setFromAxisAngle(axis, angle);
    const spin = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), (Math.PI * 2 * i / branches) + Math.random());
    let newDir = dir.clone().applyQuaternion(rot).applyQuaternion(spin).normalize();
    newDir.y = Math.max(newDir.y, -0.1);
    newDir.normalize();
    const lenFactor = 0.7 + Math.random() * 0.12;
    addBranch(end, newDir, length * lenFactor, radius * 0.68, depth - 1, maxDepth);
  }
  if (Math.random() < 0.5 && depth > 2) {
    leafPositions.push({ pos: end.clone(), scale: 0.6 + Math.random() * 0.4 });
  }
}

addBranch(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0), 8.5, 1.15, 5, 5);

// ---------- 叶簇 + 苹果 ----------
const leafGeo = new THREE.IcosahedronGeometry(1, 1);
leafPositions.forEach(({ pos, scale }) => {
  const clusterCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < clusterCount; i++) {
    const mat = leafMats[Math.floor(Math.random() * leafMats.length)];
    const leaf = new THREE.Mesh(leafGeo, mat);
    const offset = new THREE.Vector3((Math.random()-0.5)*2.2, (Math.random()-0.2)*2, (Math.random()-0.5)*2.2);
    leaf.position.copy(pos).add(offset);
    const s = scale * (1.4 + Math.random() * 1.2);
    leaf.scale.set(s, s * (0.8 + Math.random()*0.3), s);
    leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    scene.add(leaf);

    // 每片叶簇周围概率长出苹果
    if (Math.random() < 0.55) {
      const applePos = leaf.position.clone().add(new THREE.Vector3((Math.random()-0.5)*1.2, -Math.random()*1.2, (Math.random()-0.5)*1.2));
      addApple(applePos);
    }
  }
});

// 地面上掉落的苹果
for (let i = 0; i < 10; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 2 + Math.random() * 8;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  addApple(new THREE.Vector3(x, 0.5, z));
}

// ---------- 天空渐变 ----------
const skyGeo = new THREE.SphereGeometry(140, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    top: { value: new THREE.Color(0x6fb6ea) },
    bottom: { value: new THREE.Color(0xe8f6ff) }
  },
  vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vPos; uniform vec3 top; uniform vec3 bottom; void main() { float h = normalize(vPos).y * 0.5 + 0.5; gl_FragColor = vec4(mix(bottom, top, h), 1.0); }`,
  side: THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
